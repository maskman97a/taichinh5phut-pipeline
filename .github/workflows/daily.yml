name: Daily YouTube Pipeline

# AI Mỗi Ngày (iter 20): đăng 2 video/ngày — 12:00 & 20:00 giờ VN (UTC+7).
# GitHub Actions chạy UTC: 12:00 VN = 05:00 UTC, 20:00 VN = 13:00 UTC.
# Mỗi lần chạy = 1 video (idea todo kế tiếp). Manual trigger qua workflow_dispatch vẫn dùng được.
on:
  schedule:
    - cron: "0 5 * * *"    # 12:00 trưa giờ VN
    - cron: "0 13 * * *"   # 20:00 tối giờ VN
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg + ImageMagick + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu fonts-noto fonts-noto-cjk fonts-roboto fonts-open-sans wget
          # Fix ImageMagick policy ngan TextClip render
          sudo sed -i 's|rights="none" pattern="@\*"|rights="read\|write" pattern="@*"|' /etc/ImageMagick-6/policy.xml || true
          # Verify
          echo "convert: $(which convert)"
          echo "ffmpeg:  $(which ffmpeg)"
          convert -version | head -1
          # Download Be Vietnam Pro (priority - Vietnamese-optimized) + Montserrat fallback
          mkdir -p /tmp/fonts
          set +e
          # Be Vietnam Pro Black + ExtraBold
          wget -q -O /tmp/fonts/BeVietnamPro-Black.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-Black.ttf"
          if [ $? -ne 0 ] || [ ! -s /tmp/fonts/BeVietnamPro-Black.ttf ]; then
            wget -q -O /tmp/fonts/BeVietnamPro-Black.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/bevietnampro/BeVietnamPro-Black.ttf"
          fi
          wget -q -O /tmp/fonts/BeVietnamPro-ExtraBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-ExtraBold.ttf"
          if [ $? -ne 0 ] || [ ! -s /tmp/fonts/BeVietnamPro-ExtraBold.ttf ]; then
            wget -q -O /tmp/fonts/BeVietnamPro-ExtraBold.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/bevietnampro/BeVietnamPro-ExtraBold.ttf"
          fi
          # Montserrat fallback
          wget -q -O /tmp/fonts/Montserrat-ExtraBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-ExtraBold.ttf"
          if [ $? -ne 0 ] || [ ! -s /tmp/fonts/Montserrat-ExtraBold.ttf ]; then
            echo "Montserrat ExtraBold download fail - try jsdelivr CDN"
            wget -q -O /tmp/fonts/Montserrat-ExtraBold.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-ExtraBold.ttf"
          fi
          wget -q -O /tmp/fonts/Montserrat-Black.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-Black.ttf"
          if [ $? -ne 0 ] || [ ! -s /tmp/fonts/Montserrat-Black.ttf ]; then
            wget -q -O /tmp/fonts/Montserrat-Black.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-Black.ttf"
          fi
          # Verify - remove empty files
          find /tmp/fonts/ -type f -empty -delete
          echo "Downloaded fonts:"
          ls -la /tmp/fonts/ || true
          set -e
          # Always succeed - we have apt fonts fallback (Roboto, Noto, DejaVu)
          exit 0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          # GROQ_API_KEY da bo - script pre-gen boi Claude trong data/scripts/
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # iter 20: auto-post PUBLIC theo lich (user chot). Co the override qua repo Variable YT_PRIVACY.
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: python pipeline/main.py

      - name: Commit updated log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ideas.json data/published.json data/used_pexels.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto update published log"
            git push
          else
            echo "No changes to commit"
          fi
